# Verificacion del plugin en las tres versiones soportadas.
#
# QUE HACE
#   - 1.21.11: compila y ejecuta toda la suite de tests (MockBukkit es de 1.21).
#   - 26.1 y 26.2: compila el mismo codigo contra la API de Paper de esa version (perfiles
#     api-26.1 / api-26.2 del pom), con Java 25 como esos servidores. Asi una llamada que no existe
#     alli falla aqui y no en el servidor de un jugador.
#
# POR QUE EXISTE
#   El workflow de Modrinth compila con -DskipTests y solo contra 1.21.11: sin esto nada
#   comprobaria los tests ni las APIs nuevas antes de publicar.
name: Verificar

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-1-21-11:
    name: 1.21.11 (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar los tests
        run: mvn -B -ntp verify
      - name: Guardar el informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  api-nuevas:
    name: ${{ matrix.version }} (compilación)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '26.1'
            profile: api-26.1
          - version: '26.2'
            profile: api-26.2
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar contra la API de Paper ${{ matrix.version }}
        run: mvn -B -ntp -P ${{ matrix.profile }} clean compile
