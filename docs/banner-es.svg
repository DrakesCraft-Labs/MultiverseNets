<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="acG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <filter id="glowF">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes latido {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 15px #22D3EEb3); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 30px #A855F7); }
    }
    @keyframes giro {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .fondo  { fill: url(#bgG); }
    .titulo { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 900; font-size: 42px;
               fill: url(#acG); animation: latido 3.5s infinite ease-in-out; }
    .sub    { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 14px;
               fill: #94A3B8; letter-spacing: 3px; }
    .chapa  { fill: #0F172A; stroke-width: 1.5; rx: 6px; }
    .ctexto { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
  </style>

  <rect class="fondo" width="920" height="300" rx="14" stroke="#22D3EE" stroke-width="1.5" />

  <g transform="translate(460, 95)" filter="url(#glowF)">
    <!-- El giro va en SMIL y no en CSS a proposito: GitHub sirve el banner dentro de un <img>,
         y ahi `transform-box: fill-box` no se aplica igual en todos los navegadores, con lo que
         la figura giraba alrededor de la esquina del SVG en vez de sobre si misma. -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="0" y2="-38" stroke="url(#acG)" stroke-width="3"/>
    <line x1="0" y1="0" x2="34" y2="18" stroke="url(#acG)" stroke-width="3"/>
    <line x1="0" y1="0" x2="-34" y2="18" stroke="url(#acG)" stroke-width="3"/>
    <line x1="0" y1="0" x2="38" y2="-20" stroke="#A855F7" stroke-width="2" opacity="0.55"/>
    <line x1="0" y1="0" x2="-38" y2="-20" stroke="#A855F7" stroke-width="2" opacity="0.55"/>
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#0F172A" stroke="url(#acG)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="5" fill="#22D3EE">
      <animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-38" r="7" fill="#A855F7"/>
    <circle cx="34" cy="18" r="7" fill="#A855F7"/>
    <circle cx="-34" cy="18" r="7" fill="#A855F7"/>
    <circle cx="38" cy="-20" r="5" fill="#22D3EE" opacity="0.75"/>
    <circle cx="-38" cy="-20" r="5" fill="#22D3EE" opacity="0.75"/>
    </g>
  </g>

  <text x="460" y="185" text-anchor="middle" class="titulo">MULTIVERSENETS</text>
  <text x="460" y="215" text-anchor="middle" class="sub">LOGISTICA DIGITAL Y ALMACENAMIENTO MASIVO · SIN SLIMEFUN</text>

  <g transform="translate(240, 245)">
    <rect x="0" y="0" width="145" height="30" class="chapa" stroke="#22D3EE" />
    <text x="12" y="20" class="ctexto" fill="#22D3EE">DRAKES LABS</text>

    <rect x="165" y="0" width="135" height="30" class="chapa" stroke="#38BDF8" />
    <text x="177" y="20" class="ctexto" fill="#38BDF8">PAPER 1.21.11</text>

    <rect x="320" y="0" width="120" height="30" class="chapa" stroke="#A3E635" />
    <text x="332" y="20" class="ctexto" fill="#A3E635">JAVA 21</text>
  </g>
</svg>