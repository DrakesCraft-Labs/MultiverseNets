# ------------------------------------------------------------
#  MultiverseNets - main configuration
#  Author: Chagui68
# ------------------------------------------------------------

debug: false
language: en

# Convivencia con otros plugins.
compat:
  # Dejar que grabbers y pushers usen maquinas de Slimefun.
  #
  # Ponlo en false si tienes Networks (u otro plugin de logistica) instalado a la vez y prefieres
  # que cada red se ocupe solo de lo suyo. Los bloques de Networks son items de Slimefun con su
  # propio menu, asi que con esto en true un grabber de MultiverseNets puede sacar de un
  # almacenamiento de Networks. Es interoperabilidad, no un fallo, pero conviene poder apagarla.
  slimefun: true

network:
  # How often (in ticks) each network topology is rescanned.
  scan-interval-ticks: 20
  # Max nodes per network (protection against giant loops).
  max-nodes: 4096
  op-interval-ticks:
    transfer: 5
    vacuum: 10
    craft: 20

transfer:
  items-per-op: 64
  # Speed multiplier for HT (High-Throughput) importers/exporters.
  ht-multiplier: 8

greedy:
  # Buffer capacity of a Greedy Cell.
  capacity: 262144

crafter:
  max-recipes: 26

vacuum:
  radius: 4.0

# Herramientas.
rake:
  # Usos de un Network Rake recien crafteado.
  uses: 250

cells:
  # Capacity per tier (T1..T6).
  capacities: [65536, 262144, 1048576, 16777216, 268435456, 2000000000]
