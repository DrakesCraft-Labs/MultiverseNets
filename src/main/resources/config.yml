# -------------------------------------------------------------------------------------
#  MultiverseNets - Configuration File / Archivo de Configuración
#  Plugin Author / Autor: Chagui68
# -------------------------------------------------------------------------------------

# [EN] Enable verbose debug logging to console.
# [ES] Habilita registros de depuración detallados en la consola.
debug: false

# [EN] Preferred language code (en / es).
# [ES] Idioma preferido para los mensajes (en / es).
language: en

# -------------------------------------------------------------------------------------
#  Plugin Compatibility / Compatibilidad con Otros Plugins
# -------------------------------------------------------------------------------------
# [EN] Worlds where network devices cannot be placed. Empty by default: a standalone plugin has
#      no business shipping another server's world names as a hard block. Add exact world names
#      (for example "clasico") to forbid MVN there.
# [ES] Mundos donde no se pueden colocar dispositivos de red. Vacío por defecto: un plugin
#      standalone no tiene por qué traer los nombres de mundo de otro servidor como bloqueo fijo.
#      Añade nombres exactos (por ejemplo "clasico") para prohibir MVN ahí.
blocked-worlds: []

compat:
  # [EN] Allow grabbers and pushers to interact with Slimefun machines and containers.
  #      Set to false if you are running Networks or prefer MultiverseNets to manage
  #      only vanilla and native containers.
  # [ES] Permite que los grabbers y pushers interactúen con máquinas de Slimefun.
  #      Ponlo en false si tienes Networks u otro plugin de logística instalado
  #      y prefieres que cada red gestione únicamente sus propios contenedores.
  slimefun: true

# [EN] Slimefun Recipe Encoder settings.
# [ES] Ajustes del Codificador de Recetas de Slimefun.
sf-encoder:
  # [EN] Enable or disable the Slimefun Recipe Encoder machine.
  # [ES] Habilita o deshabilita la máquina de codificación de recetas de Slimefun.
  enabled: true

# [EN] Slimefun Auto-Crafter and Request Crafter settings.
# [ES] Ajustes de los Crafteadores automáticos y bajo demanda de Slimefun.
sf-crafter:
  # [EN] Enable or disable Slimefun Crafter machines (Auto-Crafter & Request Crafter).
  # [ES] Habilita o deshabilita las máquinas crafteadoras de Slimefun.
  enabled: true

# -------------------------------------------------------------------------------------
#  Network Topology & Timing / Topología y Tiempos de Red
# -------------------------------------------------------------------------------------
network:
  # [EN] Frequency (in server ticks, 20 ticks = 1 second) between network cable scans.
  # [ES] Frecuencia (en ticks de servidor, 20 ticks = 1 segundo) de escaneo de cables.
  scan-interval-ticks: 20

  # [EN] Maximum total connected nodes (devices + cables) allowed in a single network.
  #      Protects the server from infinite loops and massive builds.
  # [ES] Cantidad máxima de nodos conectados (máquinas + cables) permitidos por red.
  #      Protege al servidor contra bucles infinitos o sobrecargas de rendimiento.
  max-nodes: 16384
  # [EN] Maximum network devices allowed per chunk to prevent saturation.
  max-nodes-per-chunk: 64

  # [EN] Operation intervals (in ticks) for active network machines.
  # [ES] Intervalos de operación (en ticks) para las máquinas activas de la red.
  op-interval-ticks:
    # [EN] Item transfer frequency for Grabbers (Importers) and Pushers (Exporters).
    # [ES] Frecuencia de transferencia de Grabbers (Importadores) y Pushers (Exportadores).
    transfer: 5
    # [EN] Pickup cycle frequency for Network Vacuums.
    # [ES] Frecuencia del ciclo de recolección para los Network Vacuums.
    vacuum: 10
    # [EN] Crafting cycle frequency for Auto-Crafters.
    # [ES] Frecuencia del ciclo de crafteo para los Auto-Crafters.
    craft: 20

# -------------------------------------------------------------------------------------
#  Item Logistics / Transferencia de Ítems
# -------------------------------------------------------------------------------------
transfer:
  # [EN] Base amount of items moved per operation by standard Grabbers and Pushers.
  # [ES] Cantidad base de ítems transferidos por operación en Grabbers y Pushers normales.
  items-per-op: 128

  # [EN] Speed multiplier for High-Throughput (HT) Grabbers and Pushers (e.g. 128 * 8 = 1024).
  # [ES] Multiplicador de velocidad para Grabbers y Pushers de alto rendimiento (HT).
  ht-multiplier: 8

# -------------------------------------------------------------------------------------
#  Machine Settings / Configuración de Dispositivos y Máquinas
# -------------------------------------------------------------------------------------

# [EN] Greedy Cell settings (High-priority dedicated output buffer / sink).
# [ES] Ajustes de la Greedy Cell (Búfer / sumidero de alta prioridad para un ítem).
greedy:
  # [EN] Storage capacity of a Greedy Cell.
  # [ES] Capacidad máxima de almacenamiento de una Greedy Cell.
  capacity: 262144

# [EN] Infinity Barrel settings (Single-type massive bulk storage).
# [ES] Ajustes de la Barrica Infinita (Almacenamiento masivo para un único tipo de ítem).
barrel:
  # [EN] Storage capacity of an Infinity Barrel.
  # [ES] Capacidad máxima de almacenamiento de una Barrica Infinita.
  capacity: 2000000000

# [EN] Auto-Crafter settings.
# [ES] Ajustes del Auto-Crafter.
crafter:
  # [EN] Maximum installed blueprints/recipes per Auto-Crafter (18 matches GUI slots).
  # [ES] Cantidad máxima de recetas instalables en el Auto-Crafter (18 ranuras de GUI).
  max-recipes: 18

# [EN] Network Vacuum settings (Suction funnel for world item drops).
# [ES] Ajustes del Network Vacuum (Embudo de succión para ítems caídos en el mundo).
vacuum:
  # [EN] Suction radius in blocks around the vacuum block.
  # [ES] Radio de succión en bloques alrededor del bloque del vacuum.
  radius: 4.0

# [EN] Tool durability settings.
# [ES] Ajustes de durabilidad de herramientas.
rake:
  # [EN] Maximum durability uses for a freshly crafted Network Rake.
  # [ES] Usos de durabilidad máxima para un Network Rake recién crafteado.
  uses: 250

# [EN] Fluid Logistics & Storage settings.
# [ES] Ajustes de Logística y Almacenamiento de Fluidos.
fluids:
  # [EN] Storage capacity in millibuckets (mB) per Quantum Fluid Cell (64,000 mB = 64 Buckets).
  # [ES] Capacidad de almacenamiento en mB por Celda Cuántica de Fluidos (64,000 mB = 64 Cubos).
  cell-capacity-mb: 64000
  # [EN] Capacity in mB of a Fluid DRAM Module (installed in a DRAM Bay). One module holds
  #      several fluids at once; this is the total for all of them (512,000 mB = 512 Buckets).
  # [ES] Capacidad en mB de un Fluid DRAM Module (se instala en un DRAM Bay). Un módulo guarda
  #      varios fluidos a la vez; este es el total entre todos (512.000 mB = 512 Cubos).
  dram-capacity-mb: 512000
  # [EN] Liquid Pumps always drain one whole source block (1,000 mB) per transfer cycle
  #      (network.op-interval-ticks.transfer); there is no separate pump rate.
  # [ES] Las Bombas de Líquidos drenan un bloque fuente entero (1.000 mB) por ciclo de
  #      transferencia (network.op-interval-ticks.transfer); no hay velocidad de bombeo aparte.

# -------------------------------------------------------------------------------------
#  Quantum Storage Cells / Celdas Cuánticas de Almacenamiento
# -------------------------------------------------------------------------------------
cells:
  # [EN] Capacity in items per cell tier (Tier 1 through Tier 6).
  #      T1: 65,536 items      (1,024 stacks)
  #      T2: 262,144 items     (4,096 stacks)
  #      T3: 1,048,576 items   (16,384 stacks)
  #      T4: 16,777,216 items  (262,144 stacks)
  #      T5: 268,435,456 items (4,194,304 stacks)
  #      T6: 2,000,000,000 items (Bulk storage)
  #
  # [ES] Capacidad en ítems por nivel de celda (Tier 1 a Tier 6).
  #      T1: 65,536 ítems      (1,024 stacks)
  #      T2: 262,144 ítems     (4,096 stacks)
  #      T3: 1,048,576 ítems   (16,384 stacks)
  #      T4: 16,777,216 ítems  (262,144 stacks)
  #      T5: 268,435,456 ítems (4,194,304 stacks)
  #      T6: 2,000,000,000 ítems (Almacenamiento masivo)
  capacities: [65536, 262144, 1048576, 16777216, 268435456, 2000000000]

# -------------------------------------------------------------------------------------
#  Memory Modules / Módulos de Memoria (DRAM Bay)
# -------------------------------------------------------------------------------------
# [EN] Item capacity of each memory module tier. Modules are installed in a DRAM Bay; when a
#      module is taken out it keeps its items, and they appear in whatever network it is
#      installed in next. Old Controllers that still hold a module keep working.
# [ES] Capacidad en ítems de cada nivel de módulo de memoria. Los módulos se instalan en un DRAM
#      Bay; al sacar un módulo conserva sus ítems, que aparecen en la red donde se instale. Los
#      Controladores antiguos que aún tienen un módulo siguen funcionando.
virtual-cache:
  tier-1: 2048
  tier-2: 8192
  tier-3: 32768
  tier-4: 131072
  tier-5: 524288

# -------------------------------------------------------------------------------------
#  Land Protection / Protección de Tierras
# -------------------------------------------------------------------------------------
# [EN] Without this, a grabber sitting in public land can read a chest inside somebody's
#      region, so two players end up robbing each other through their own networks.
#      Every block a network reads from or writes to is checked, and the topology scan
#      refuses to route cables through protected land, so networks on opposite sides of a
#      border never merge into one item bus.
#      A network is anonymous, so it cannot be judged "trusted" the way a member of a claim
#      can — EXCEPT by the one identity it does have: the Controller remembers the UUID of
#      whoever placed it, and the network may operate inside that player's own claims.
#      Build your base's network inside your own claim and it just works; a network parked
#      next to your border still cannot reach in, because it belongs to somebody else.
#      Controllers placed before this rule existed have no owner: the first legitimate player
#      to open one becomes its owner on the spot, so old worlds heal on first use. If you
#      deliberately want somebody else's network to run in a region, use exempt-worlds /
#      exempt-locations below, or /mvnets doctor to see where a network was cut.
# [ES] Sin esto, un grabber en tierra pública puede leer un cofre dentro de la región de
#      otro jugador, así que dos jugadores acaban robándose entre sí a través de sus redes.
#      Cada bloque del que la red lee o en el que escribe se comprueba, y el escaneo se niega
#      a tender cable por tierra protegida, así que dos redes a lados opuestos de una
#      frontera nunca se fusionan en un mismo bus de ítems.
#      Una red es anónima, así que no se la puede juzgar "de confianza" como a un miembro de
#      un reclamo — SALVO por la única identidad que sí tiene: el Controlador recuerda el UUID
#      de quien lo colocó, y la red puede operar dentro de los reclamos de ese jugador.
#      Construye la red de tu base dentro de tu propio reclamo y funciona sin más; una red
#      aparcada junto a tu frontera sigue sin poder entrar, porque es de otro.
#      Los controladores colocados antes de que existiera esta regla no tienen dueño: el primer
#      jugador legítimo que abra uno pasa a ser su dueño al momento, así que los mundos
#      antiguos se curan al primer uso. Si de verdad quieres que la red de otro corra en una
#      región, usa exempt-worlds / exempt-locations, o /mvnets doctor para ver dónde se cortó.
protection:
  # [EN] Master switch. false = MultiverseNets ignores every protection plugin.
  # [ES] Interruptor maestro. false = MultiverseNets ignora todos los plugins de protección.
  enabled: true

  # [EN] Which protection plugins to bridge into. Remove ids you do not use.
  #      An empty list enables all of them, so new providers work without editing this.
  # [ES] Con qué plugins de protección integrarse. Quita los ids que no uses.
  #      Una lista vacía los activa todos, así que los nuevos providers funcionan sin editar esto.
  providers:
    - PROTECTIONSTONES
    - WORLDGUARD
    - LANDS
    - TOWNY
    - GRIEFPREVENTION

  # [EN] true  = other players' claims are off limits too, not just server regions. This never
  #      affects the network's own owner: whoever placed the Controller always runs his own
  #      claim.
  #      false = only server regions block foreign networks; other players' claims are treated
  #      as public, so a network can reach into them.
  #      Ignored by ProtectionStones: its API cannot tell a claim from a server region, so
  #      claims there stay protected for strangers either way. The owner rule still applies.
  # [ES] true  = los reclamos de otros jugadores también son intocables, no solo las regiones
  #      del servidor. Esto nunca afecta al dueño de la propia red: quien colocó el Controlador
  #      siempre opera dentro de su propio reclamo.
  #      false = solo las regiones bloquean redes ajenas; los reclamos de otros se tratan como
  #      públicos, así que una red puede alcanzarlos.
  #      ProtectionStones ignora esta opción: su API no distingue un reclamo de una región del
  #      servidor, así que sus reclamos quedan protegidos ante extraños igual. La regla del
  #      dueño se sigue aplicando.
  allow-claims: false

  # [EN] true = the topology scan stops at protected borders, so a cable cannot bridge two
  #      networks across a region. Set false only if your networks legitimately cross land
  #      and you prefer the old behaviour of a single merged bus.
  # [ES] true = el escaneo se detiene en las fronteras, así un cable no puede unir dos redes
  #      cruzando una región. Ponlo en false solo si tus redes cruzan tierra a propósito.
  block-network-linking: true

  # [EN] true = players cannot open or configure network devices standing on protected land
  #      they do not own. Owners and members of a ProtectionStones claim CAN always use their
  #      terminal and their machines inside it; only strangers are blocked.
  # [ES] true = los jugadores no pueden abrir ni configurar dispositivos en tierra protegida
  #      que no sea suya. Dueños y miembros de un reclamo de ProtectionStones SIEMPRE pueden
  #      usar su terminal y sus máquinas dentro de ella; solo se bloquea a los extraños.
  deny-player-interaction: true

  # [EN] Permission that skips the check for players. The multiversenets.admin permission
  #      always bypasses too. Leave empty to remove the non-admin bypass.
  # [ES] Permiso que omite la comprobación a los jugadores. multiversenets.admin siempre
  #      pasa también. Déjalo vacío para quitar el bypass a los no-admin.
  bypass-permission: multiversenets.protection.bypass

  # [EN] Ticks between full cache drops. Lower = protection edits and claim changes apply
  #      faster, at the cost of more protection-plugin lookups.
  # [ES] Ticks entre vaciados de caché. Menos = los cambios se aplican más rápido, a costa
  #      de más consultas a los plugins de protección.
  cache-ticks: 100

  # [EN] Worlds where networks work normally even if fully claimed.
  #      MultiverseNets already detects a world that no protection plugin manages and skips the
  #      check there, which is why the nether and the end work out of the box. Listing a world here
  #      is still worth it if you DID configure WorldGuard or Towny there, because then the check
  #      does run and this is how you switch it off. Exact world names, e.g. world_nether.
  # [ES] Mundos donde las redes funcionan normal aunque esten totalmente reclamados.
  #      MultiverseNets ya detecta los mundos que ningun plugin de proteccion gestiona y ahi se
  #      salta la comprobacion, por eso el Nether y el End funcionan de serie. Anadir un mundo aqui
  #      sigue sirviendo si tu SI configuraste WorldGuard o Towny ahi, porque entonces la
  #      comprobacion si se ejecuta y esta es la forma de desactivarla. Nombres exactos.
  exempt-worlds: []


  # [EN] Spheres where networks work normally, as world;x;y;z;radius. Radius defaults to 16.
  #      This is the escape hatch for bases you legitimately built MVN inside.
  # [ES] Esferas donde las redes funcionan normal, como mundo;x;y;z;radio. El radio por
  #      defecto es 16. Esta es la salida para las bases donde sí construiste MVN.
  exempt-locations: []
  #  - "world;120;64;-340;48"

# -------------------------------------------------------------------------------------
#  Wireless Terminal & Router / Terminal Inalámbrica y Enrutador
# -------------------------------------------------------------------------------------
wireless:
  # Combat tag cooldown in seconds before wireless terminal can be accessed
  combat-cooldown-seconds: 10
  # Max range in blocks when network lacks a Network Router antenna
  local-range-without-router: 64
